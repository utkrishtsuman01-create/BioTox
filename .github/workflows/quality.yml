name: BioTox quality checks
on:
  push:
  pull_request:
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app.py
      - run: pytest -q
  static-site-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -c "from pathlib import Path; p=Path('index.html').read_text(); assert '<title>BioTox' in p; assert 'favicon.svg' in p; assert 'How it works' in p; print('Static site checks passed')"
